[project]
name = "semraa-tts-worker"
version = "0.1.0"
description = "Text-to-speech: Kokoro (English), Indic Parler-TTS (Tamil)"
requires-python = ">=3.12"
dependencies = ["semraa-worker-common"]

[tool.uv.sources]
semraa-worker-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semraa_tts"]
