[project]
name = "semraa-stt-worker"
version = "0.1.0"
description = "Speech-to-text: faster-whisper (English), IndicConformer (Tamil), sherpa-onnx (captions), Silero VAD"
requires-python = ">=3.12"
dependencies = ["semraa-worker-common"]

[tool.uv.sources]
semraa-worker-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semraa_stt"]
