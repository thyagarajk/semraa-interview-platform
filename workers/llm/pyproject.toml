[project]
name = "semraa-llm-worker"
version = "0.1.0"
description = "LLM client for Ollama (dev) / vLLM (prod), structured JSON output only"
requires-python = ">=3.12"
dependencies = ["semraa-worker-common"]

[tool.uv.sources]
semraa-worker-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semraa_llm"]
