# Semraa local development stack. All ports bind to 127.0.0.1 only.
# Usage (from deploy/dev):  cp .env.example .env  &&  docker compose up -d
# With Ollama on an NVIDIA GPU:  docker compose --profile ai up -d
name: semraa-dev

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    <<: *hardening
    image: postgres:18.7-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      SEMRAA_MIGRATOR_PASSWORD: ${SEMRAA_MIGRATOR_PASSWORD:?set in .env}
      SEMRAA_APP_PASSWORD: ${SEMRAA_APP_PASSWORD:?set in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - statement_timeout=30s
      - -c
      - idle_in_transaction_session_timeout=60s
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g

  pgbouncer:
    <<: *hardening
    image: edoburu/pgbouncer:v1.26.1-p0
    environment:
      DB_HOST: postgres
      DB_NAME: semraa
      DB_USER: semraa_app
      DB_PASSWORD: ${SEMRAA_APP_PASSWORD:?set in .env}
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:6432:5432"
    mem_limit: 128m

  keycloak:
    <<: *hardening
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 1g

  rabbitmq:
    <<: *hardening
    image: rabbitmq:4.4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: semraa
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set in .env}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  valkey:
    <<: *hardening
    image: valkey/valkey:9.2.1-alpine3.24
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    user: "999:999"
    read_only: true
    mem_limit: 320m

  seaweedfs:
    <<: *hardening
    image: chrislusf/seaweedfs:4.55
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    volumes:
      - seaweeddata:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:9333:9333"
    mem_limit: 512m

  mailpit:
    <<: *hardening
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    mem_limit: 128m

  # Ollama has no authentication: it must never listen on a public interface.
  ollama:
    <<: *hardening
    image: ollama/ollama:0.40.18
    profiles: ["ai"]
    volumes:
      - ollamadata:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  pgdata:
  rabbitdata:
  seaweeddata:
  ollamadata:
